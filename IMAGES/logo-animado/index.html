<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logo AC animado</title>
<link rel="stylesheet" href="logo-animado.css">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; gap: 28px;
         background: #ffffff; font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; color: #5b6770; }
  .palco { display: grid; place-items: center; gap: 24px; padding: 40px 16px; }
  button { font: inherit; padding: 8px 18px; border-radius: 999px; border: 1px solid #d8dde2; background: #fff; cursor: pointer; }
  button:hover { border-color: #b98a86; color: #12181c; }
</style>
</head>
<body>
<div class="palco">
  <!-- Copiar este bloco para o site (com o logo-animado.css e a pasta camadas/) -->
  <div class="ac-logo" role="img" aria-label="Logótipo AC">
    <img class="ac-traco" src="camadas/traco.png" alt="">
    <img class="ac-lambda" src="camadas/lambda.png" alt="">
    <div class="ac-c"><img src="camadas/c.png" alt=""><span class="ac-brilho"></span></div>
  </div>
  <!-- fim do bloco -->
  <button type="button" id="repetir">Repetir animação</button>
</div>
<script>
  // Só para esta página de demonstração: volta a correr a animação.
  document.getElementById("repetir").addEventListener("click", () => {
    const logo = document.querySelector(".ac-logo");
    const copia = logo.cloneNode(true);
    logo.replaceWith(copia);
  });
</script>
</body>
</html>
